name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # The JSON parser is the part that decides whether the number on screen is
  # correct, and it has no Switch dependency, so it is tested on a normal host
  # with the sanitizers enabled. This job is the real gate.
  test:
    name: host tests (json parser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests under ASan/UBSan
        run: make -C tests run

  build:
    name: build .ovl (devkitA64)
    runs-on: ubuntu-latest
    needs: test
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      # Produces nextendo-ovl.ovl. No SD-card zip: the .ovl is copied straight
      # to sdmc:/switch/.overlays/, so a package would only be an extra step.
      - name: Build overlay
        run: bash scripts/build.sh

      - name: Upload .ovl
        uses: actions/upload-artifact@v4
        with:
          name: nextendo-ovl
          path: nextendo-ovl.ovl
          if-no-files-found: error

      # A minimal overlay that draws text and initialises nothing. Used to tell
      # a problem in this overlay's own code apart from a problem in the
      # libtesla/loader integration.
      - name: Build diagnostic probe
        run: bash scripts/build_probe.sh

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: probe-ovl
          path: probe/probe-ovl.ovl
          if-no-files-found: error

      # Same idea, but for the network path: reports the exact libnx result
      # codes for DNS, connect and TLS so a failure is not just "couldn't
      # resolve host name".
      - name: Build network probe
        run: bash scripts/build_netprobe.sh

      - name: Upload network probe
        uses: actions/upload-artifact@v4
        with:
          name: netprobe-ovl
          path: netprobe/netprobe-ovl.ovl
          if-no-files-found: error
