name: build

# Builds the overlay. Pushing a version tag also publishes a release with the
# .ovl attached, which is what users download.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash scripts/build.sh

      - name: Upload .ovl
        uses: actions/upload-artifact@v4
        with:
          name: nextendo-status-ovl
          path: nextendo-status.ovl
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nextendo-status.ovl
          generate_release_notes: true
          body: |
            Copy `nextendo-status.ovl` to `sdmc:/switch/.overlays/` on your SD card.

            Open the overlay menu with `L + Down + R-Stick` and pick **Nextendo Status**.
