name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Build main overlay
        run: bash scripts/build.sh

      - name: Build NAT check overlay
        run: bash scripts/build_natchk.sh

      - name: Upload main overlay
        uses: actions/upload-artifact@v4
        with:
          name: nextendo-status-ovl
          path: nextendo-status.ovl
          if-no-files-found: error

      - name: Upload NAT check overlay
        uses: actions/upload-artifact@v4
        with:
          name: nextendo-natchk-ovl
          path: nextendo-natchk.ovl
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nextendo-status.ovl
            nextendo-natchk.ovl
          generate_release_notes: true