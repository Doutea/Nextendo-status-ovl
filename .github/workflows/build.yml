name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Build main overlay
        env:
          NEXTENDO_RELAY_KEY: ${{ secrets.NEXTENDO_RELAY_KEY }}
        run: |
          sed -i 's/\r//g' Makefile scripts/build.sh scripts/embed_relay.py
          bash scripts/build.sh

      - name: Upload main overlay
        uses: actions/upload-artifact@v4
        with:
          name: nextendo-status-ovl
          path: nextendo-status.ovl
          if-no-files-found: error

      # The NAT check overlay is no longer built or attached to releases. Its
      # sources stay in natchk/ and scripts/build_natchk.sh still builds it by
      # hand if it is ever wanted again.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nextendo-status.ovl
          generate_release_notes: true
