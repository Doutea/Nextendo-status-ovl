name: ref

# Builds Chasetodie/Nextendo-Status-Overlay with the fixes applied here.
on:
  push:
    branches: [main]
    paths:
      - 'ref-overlay/**'
      - 'scripts/build_ref.sh'
      - '.github/workflows/ref.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash scripts/build_ref.sh

      - name: Upload .ovl
        uses: actions/upload-artifact@v4
        with:
          name: nextendo-ref-ovl
          path: nextendo-ref.ovl
          if-no-files-found: error
