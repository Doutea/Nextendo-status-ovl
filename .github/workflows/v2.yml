name: v2

# Builds the v2 (minimal) overlay: written from scratch against probe-ovl, the
# only overlay here that has never crashed on the target console.
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'scripts/build_v2.sh'
      - '.github/workflows/v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash scripts/build_v2.sh

      - name: Upload .ovl
        uses: actions/upload-artifact@v4
        with:
          name: nextendo-v2-ovl
          path: nextendo-v2.ovl
          if-no-files-found: error
