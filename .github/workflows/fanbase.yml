name: fanbase

# Builds the NX-FanControl-based overlay plus the log probe used to diagnose its
# exit-time crash.
on:
  push:
    branches: [main]
    paths:
      - 'fancontrol-base/**'
      - 'diagprobe/**'
      - 'scripts/build_fanbase.sh'
      - 'scripts/build_diagprobe.sh'
      - '.github/workflows/fanbase.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build overlay
        run: bash scripts/build_fanbase.sh

      - name: Upload overlay
        uses: actions/upload-artifact@v4
        with:
          name: nextendo-fanbase-ovl
          path: nextendo-ovl.ovl
          if-no-files-found: error

      # The probe exists because every earlier attempt to capture a diagnostic
      # log from the overlay produced no file. It proves the SD-card write works
      # from the same call sites the real log would use.
      - name: Build log probe
        run: bash scripts/build_diagprobe.sh

      - name: Upload log probe
        uses: actions/upload-artifact@v4
        with:
          name: nextendo-diagprobe-ovl
          path: nextendo-diagprobe.ovl
          if-no-files-found: error
