name: langprobe

# Builds the language diagnostic overlay, which reports the Result code of every
# call the main overlay's language check makes.
on:
  push:
    branches: [main]
    paths:
      - 'langprobe/**'
      - 'scripts/build_langprobe.sh'
      - '.github/workflows/langprobe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash scripts/build_langprobe.sh

      - name: Upload .ovl
        uses: actions/upload-artifact@v4
        with:
          name: nextendo-langprobe-ovl
          path: nextendo-langprobe.ovl
          if-no-files-found: error
