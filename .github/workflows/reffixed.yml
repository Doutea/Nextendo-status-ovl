name: reffixed

# Builds the fixed variant of Chasetodie/Nextendo-Status-Overlay.
on:
  push:
    branches: [main]
    paths:
      - 'ref-fixed/**'
      - 'scripts/build_ref_fixed.sh'
      - '.github/workflows/reffixed.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash scripts/build_ref_fixed.sh

      - name: Upload .ovl
        uses: actions/upload-artifact@v4
        with:
          name: nextendo-ref-fixed-ovl
          path: nextendo-ref-fixed.ovl
          if-no-files-found: error
